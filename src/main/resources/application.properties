# ---------------------------------------------------------------------------
# Shared configuration. Defaults are production-safe: PostgreSQL, settings from
# environment variables, no H2. Local development uses the `dev` profile
# (application-dev.properties), which the default Maven build activates for
# `./mvnw spring-boot:run`.
# ---------------------------------------------------------------------------

spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Flyway ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# --- JWT ---
# Signing key: Base64-encoded, >= 64 bytes (HS512). Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Admin account ---
# Provisioned at startup; self-registration can never grant ROLE_ADMIN. Skipped when no password is set.
# Set via APP_ADMIN_USERNAME / APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD (password: at least 12 characters).
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
