# ---------------------------------------------------------------------------
# Shared configuration. Defaults are production-safe: PostgreSQL, settings from
# environment variables, no H2. Local development uses the `dev` profile
# (application-dev.properties), which the default Maven build activates for
# `./mvnw spring-boot:run`.
# ---------------------------------------------------------------------------

spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Flyway ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# --- JWT ---
# Signing key: Base64-encoded, >= 64 bytes (HS512). Generate with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
