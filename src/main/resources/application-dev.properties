# ---------------------------------------------------------------------------
# Local development: file-based H2 database with web console and SQL logging.
# H2 is only on the classpath in the `dev` Maven profile (active by default).
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:${DB:./data/flightDB};AUTO_SERVER=true;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
