name: Security scan

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - pom.xml
      - dependency-check-suppressions.xml
      - .github/workflows/security-scan.yml
  schedule:
    # Weekly, so newly published CVEs are caught even without code changes
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: OWASP dependency-check
    # Fork PRs get neither the NVD_API_KEY secret nor code-scanning write access
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The NVD database is large; restore the most recent copy and save an updated one each run
      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # -Pprod scans exactly what ships (no dev-only H2). Fails on CVSS >= 7.
      - name: Scan dependencies
        run: ./mvnw -B -Pprod,security-scan -DskipTests verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Publish results to GitHub code scanning
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
